<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>
    <header class="header">
        <section class="header__top">
            <div class="header__search">
                <label for="search" class="header__label"></label>
                <input type="search" class="header__input" name="user__query" id="search">
            </div>
            <div class="header__user-nav">
                <button class="header__icon-button">
                    <img src="" alt="" class="header__icon">
                </button>
                <img src="" alt="" class="header__avatar-sm">
                <h2 class="header__username">
                    Morgan Oakley
                </h2>
            </div>
        </section>
        <section class="header__bottom">
            <div class="header__user-info">
                <img src="" alt="" class="header__avatar-bg">
                <div class="header__welcome-group">
                    <p class="header__welcome-hello">
                        Hi there,
                    </p>
                    <h1 class="header__welcome-user">Morgan Oakley <span>(@morgan)</span></h1>
                </div>
            </div>
            <div class="header__actions">
                <button class="header__actions-button">New</button>
                <button class="header__actions-button">Upload</button>
                <button class="header__actions-button">Share</button>
            </div>
        </section>
    </header>

</body>
</html>
